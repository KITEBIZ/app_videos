<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Estúdio v2 · prancha aprovada em 16/10/2026: funil como menu no alto, a etapa ou o vídeo no meio, o chat embaixo. */
:root{--fundo:#0a1748;--cartao:#13235f;--linha:#2a3d86;--texto:#f4f6ff;--apagado:#b8c3ea;--azul:#9cbcff;--amarelo:#ffc933;
  --rosa:#ff8a95;--verde:#8fe3a8;--chat:#0f1f5c;--resposta:#263c8c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--fundo);color:var(--texto);font-family:'Source Sans 3',system-ui,sans-serif}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
nav{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:6px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px}
.marca{display:flex;align-items:center;gap:8px}
.marca img{height:30px;width:auto}
#vivo{font-size:10px;color:#6f7fb8}#vivo.caiu{color:var(--rosa);font-weight:700;font-size:12px}
#conta{font-size:10px;color:#6f7fb8}#conta.alto{color:var(--rosa);font-weight:700;font-size:12px}
.funil{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:center}
.funil button{border:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;clip-path:polygon(0 0,100% 6%,100% 94%,0 100%)}
.funil button b{font-family:Montserrat,sans-serif;font-weight:900}
.funil button span{font-size:10px;font-weight:700}
.funil button[aria-current=page]{background:var(--amarelo)!important;color:var(--fundo)!important}
main{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rotulo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amarelo)}
.cartao{text-decoration:none;color:inherit;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit}
.cartao.espera{border:2px solid var(--amarelo)}
.cartao .tag{font-size:11px;font-weight:700;color:var(--azul);letter-spacing:.06em;text-transform:uppercase}
.cartao.espera .tag{color:var(--amarelo)}
.cartao .tag.parou{color:var(--rosa)}
/* 24/10/2026 (ele: "tá estourando a tela ali no thumbnail"): a capa no tamanho da miniatura da pauta, em 3:4 (o recorte da grade) */
.cartao.com-capa{position:relative;padding-right:64px;min-height:72px}
.cartao-capa{position:absolute;right:10px;top:10px;width:44px;aspect-ratio:3/4;object-fit:cover;border-radius:5px;border:1px solid var(--linha)}
.pub-tag{display:flex;align-items:center;gap:8px;color:var(--amarelo)}
.pub-mini svg{width:34px;height:auto;display:block}.pub-mini circle{animation:onda 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
/* referencia-na-lista (17/10/2026; ele: "um thumbnail da capa do vídeo original [...] e o link nessa lista") */
.cartao.com-ref{position:relative;padding-right:60px}
.cartao-ref{position:absolute;right:10px;top:10px;width:40px}
.cartao-ref img{width:40px;height:50px;object-fit:cover;border-radius:5px;border:1px solid var(--linha);display:block}
/* 24/10/2026 (ele: "poderia dar um resumo curto do video naquela area, informar qual é o perfil") */
.canal-tit{margin:14px 2px 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--azul)}
.canal-post{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;color:inherit;text-decoration:none;min-height:44px}
.canal-post .cp-data{font-size:12px;color:#8f9cc9}.canal-post .cp-tit{font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.canal-post .cp-num{font-size:12px;color:var(--azul);white-space:nowrap}
.cartao-origem{font-size:13px;color:#8f9cc9;line-height:1.35}.cartao-origem .perfil{color:var(--azul);font-weight:700}
.ver-original{color:var(--azul);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap}
.cartao b{font-size:15px}
.vazio{color:var(--apagado);font-size:14px;padding:8px 2px}
.cab{display:flex;align-items:center;gap:8px;position:sticky;top:-10px;z-index:4;background:var(--fundo);margin:-10px -12px 0;padding:10px 12px 6px}
/* 24/10/2026 (ele: "o topo qual roteiro esta e tudo mais deveria ficar fixo"): o título e a linha do roteiro ficam presos */
.arvore .roteiro-linha{position:sticky;top:var(--cab-h,52px);z-index:3;background:var(--fundo);box-shadow:0 8px 10px -2px var(--fundo)}
.cab div{display:flex;flex-direction:column;min-width:0}
.voltar-item{flex:none;align-self:center;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--linha);background:transparent;color:var(--texto);font:inherit;font-size:22px;cursor:pointer}
.cab b{font-size:15px}
.cab small{font-size:12px;color:var(--apagado)}
.bloco{display:flex;gap:8px;padding:6px 2px;border-bottom:1px solid #1f3175}
.bloco.mudou{background:rgba(255,201,51,.16);border-radius:6px;padding:6px 4px;border-bottom-color:transparent}
.num{flex:none;width:22px;height:22px;border-radius:5px;margin-top:1px;background:var(--amarelo);color:var(--fundo);font-family:Montserrat,sans-serif;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.bloco.dele .num{background:var(--rosa)}
.bloco>div:last-child{min-width:0;display:flex;flex-direction:column;gap:1px}
.bloco .q{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--azul);text-transform:uppercase}
.bloco .f{font-size:14px;line-height:1.3}
.bloco .t{font-size:11px;color:#8f9cc9}
.bloco .agora{font-size:12px;color:var(--amarelo)}
.acao{position:sticky;bottom:0;box-shadow:0 -8px 12px var(--fundo);min-height:50px;border-radius:12px;border:0;background:var(--amarelo);color:var(--fundo);font:inherit;font-weight:700;font-size:16px;cursor:pointer;flex:none}
.acao:disabled{background:#3a4a86;color:var(--apagado)}
.acao.travado{background:#3a4a86;color:#c9d2f0}
.acao.travado.mostrando{background:#2a3570;color:var(--amarelo);font-size:14px;font-weight:600;line-height:1.3;padding:8px 12px}
.passo{font-size:13px;color:var(--azul);padding:4px 2px}
.passo.parou{color:var(--rosa)}
section.chat{flex:none;background:var(--chat);border-top:2px solid var(--amarelo);padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
/* 19/10/2026 (ele: "ali em cima não dá para ler o script e o botão atrapalha"): o botão principal (Aprovar...) sai de
   cima do roteiro e fica embaixo, depois dos botões do chat; a conversa volta a ocupar menos (34vh) e o aviso do sistema fica em 3 linhas */
#acao-slot:empty{display:none}
.acao.direcao{background:#d63a3a;color:#fff}
.acao.montar{background:transparent;color:var(--amarelo);border:1px solid var(--amarelo);min-height:38px;font-size:14px;font-weight:600}
#acao-slot .acao.montar{min-height:38px}
#acao-slot .acao{position:static;box-shadow:none;width:100%;min-height:46px}
#acao-slot .falta-aprovar{position:static;box-shadow:none;font-size:13px;padding:8px 12px}
.resp-m.sistema div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.resp-m.sistema.aberto div{display:block}
/* dentro de um vídeo a tela divide: o roteiro com 40% da altura (sempre dá para ler) e a conversa com o resto */
/* 19/10/2026 (ele: "quando eu entro no vídeo não consigo mais voltar para a lista de vídeos"): o ‹ fica também no topo,
   sempre à vista dentro de um vídeo (o do cabeçalho do vídeo some quando a prévia toca ou quando a página rola) */
#voltar-topo{min-width:40px;min-height:40px;margin-right:8px;border-radius:10px;border:1px solid var(--linha);background:transparent;color:var(--texto);font:inherit;font-size:22px;cursor:pointer}
/* 24/10/2026 (ele: "aquele espaço em branco ali no chat, por que aqui?"): dentro do vídeo o chat ocupava o resto da
   tela mesmo com uma mensagem só. Agora o meio (roteiro, prévia) fica com o espaço livre, com no mínimo a altura de
   antes, e o chat cresce só com as mensagens; conversa longa rola dentro dele. */
#app.no-video:not(.escrevendo):not(.assistindo) main{flex:1 1 0;min-height:40dvh}
#app.no-video:not(.escrevendo):not(.assistindo) section.chat{flex:0 1 auto;min-height:0}
#app.no-video:not(.escrevendo):not(.assistindo) #msgs{max-height:none;flex:0 1 auto;min-height:0}
#msgs{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}   /* 19/10/2026 (ele: "fica complicado ler a resposta"): era 20vh */
/* 20/10/2026 (ele, iPhone: "no iphone esta ruim de trabalhar"; a lista ficava com um cartão espremido e a conversa com o
   resto): na lista, a conversa mostra só a última mensagem em 2 linhas */
#app:not(.no-video) #msgs>:not(:last-child){display:none}
#app:not(.no-video) #msgs>:last-child div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 19/10/2026 (ele: "a tela tem que ser mobile first"; no iPhone o roteiro ficava com 280 px, 172 escrevendo): dentro de
   um vídeo o funil some (o ‹ volta); escrevendo, as mensagens antigas se recolhem e o roteiro fica à vista */
/* 24/10/2026 (ele: "o cabeçalho que é o menu de itens deveria aparecer o tempo todo, mesmo quando estou dentro de um item"):
   dentro do vídeo o funil volta, numa faixa fina (número e nome numa linha), para o roteiro não perder espaço no celular */
#app.no-video #funil button{height:34px!important;flex-direction:row;gap:6px;clip-path:none}
#app.no-video #funil button b{font-size:15px!important}#app.no-video #funil button span{font-size:10px}
#app.escrevendo #msgs,#app.escrevendo #mais-abaixo{display:none}
#mais-abaixo{align-self:center;margin-top:-6px;min-height:36px;padding:0 16px;border-radius:18px;border:0;background:var(--amarelo);color:var(--fundo);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.dele-m{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.dele-m div{font-size:14px;line-height:1.35;background:rgba(255,201,51,.14);border:1px solid rgba(255,201,51,.35);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.dele-m span{font-size:11px;color:var(--verde)}
.carimbo{float:right;margin:6px 0 -3px 10px;font-size:11px;line-height:1.2;white-space:nowrap}
.resp-m .carimbo{color:#a9b6e6}.resp-m div.md .carimbo{display:block;text-align:right;float:none;margin:2px 0 -4px}
.dele-m span.enviando{color:var(--apagado)}
.dele-m span.falhou{color:var(--rosa);cursor:pointer;text-decoration:underline}
.resp-m{display:flex;flex-direction:column;gap:2px}
.resp-m div{font-size:15px;line-height:1.5;color:#eef1ff;background:var(--resposta);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.resp-m div.md{white-space:normal}
.resp-m:not(.sistema)>div.md{border:1px solid #6a86d6}   /* 24/10/2026 (ele: "faz a C") */
.resp-m div.md p{margin:0 0 8px}
.resp-m div.md p:last-child,.resp-m div.md ul:last-child{margin-bottom:0}
.resp-m div.md ul{margin:0 0 8px;padding-left:18px}
.resp-m div.md li{margin-bottom:6px}
.resp-m div.md b{color:#fff}
.resp-m div.md a{color:var(--azul)}
.resp-m.sistema div{background:transparent;border:1px solid var(--linha);color:var(--apagado)}
.resp-m span{font-size:11px;color:#8f9cc9}
.detalhes{font-size:12px;color:#8f9cc9;margin:2px 2px 0}.detalhes summary{cursor:pointer;min-height:28px;display:flex;align-items:center}.detalhes summary::marker{content:''}.detalhes summary::after{content:'▸';margin-left:4px}.detalhes[open] summary::after{content:'▾'}.detalhes p{margin:4px 0 6px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
#trabalho{font-size:12px;color:var(--azul)}
.passo-ag{color:#8f9cc9;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid #8a93b8;background:transparent;color:var(--texto);font:inherit;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--amarelo);color:var(--fundo);border-color:var(--amarelo);font-weight:700}
.chips span{font-size:12px;color:var(--apagado)}
textarea{width:100%;min-height:44px;max-height:22vh;overflow-y:auto;resize:none;border-radius:10px;border:1px solid var(--linha);background:var(--fundo);color:var(--texto);padding:10px 12px;font:inherit;font-size:16px;line-height:1.35}
.botoes{display:flex;gap:6px;align-items:flex-end}.botoes textarea{flex:1;min-width:0}
.botoes button{min-height:44px;border-radius:10px;border:1px solid var(--linha);background:transparent;color:var(--texto);font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 14px}
#anexar,#ditar,#enviar{min-width:44px;padding:0 10px;justify-content:center}
#ditar.gravando{border-color:var(--rosa);color:var(--rosa)}
#enviar{border:0;background:var(--amarelo);color:var(--fundo);font-weight:700}
#enviar:disabled{background:#3a4a86;color:var(--apagado)}
.esp{flex-grow:1}
:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
[hidden]{display:none!important}
.opiniao{background:#101f57;border:1px solid #3a4f9c;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35;color:#dfe5ff}
.opiniao summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--azul)}
.partes{border-collapse:collapse;margin:6px 0;width:100%}.partes td{padding:3px 6px 3px 0;vertical-align:top;border-bottom:1px solid #22357e}.partes td:first-child{white-space:nowrap;color:var(--azul)}
.pedir-ajuste:disabled{opacity:.55;cursor:default}.pedir-ajuste:disabled::after{content:' · pedido enviado, esperando a resposta…'}
.pedir-ajuste{margin-top:8px;width:100%;min-height:40px;border-radius:10px;border:1px solid var(--amarelo);background:transparent;color:var(--amarelo);font:inherit;font-weight:700;cursor:pointer}
.bolas{display:flex;gap:0}
.bola{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 2px;vertical-align:-1px}
.voz-caixa{background:#101f57;border:1px solid #3a4f9c;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.avisos{margin:0;padding-left:18px;font-size:12px;color:var(--amarelo)}
.anim-topo{display:flex;gap:10px;align-items:flex-start}
.progresso{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--azul)}
.editando{display:flex;flex-direction:column;gap:6px;background:#101f57;border:1px solid #3a4f9c;border-radius:10px;padding:10px 14px}
/* 24/10/2026 (ele: "o quadro de andamento pode ser menor, esta ocupando uma area muito grande"): uma linha, barra fina */
.editando .ed-linha{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.editando .ed-tit{font-size:14px;font-weight:800}
.editando .ed-pct{font-size:20px;line-height:1;color:var(--amarelo);font-variant-numeric:tabular-nums}
.editando .barra-prog{width:100%;height:6px;border-radius:3px}
.editando .ed-sub{font-size:11px;color:var(--azul);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-prog{height:8px;border-radius:4px;background:#22357e;overflow:hidden}.barra-prog div{height:100%;background:var(--amarelo);transition:width .6s}
/* 16/10/2026 (ele: "quando clica para dar play ele aumenta ali dentro da área para poder ver"): tocando, a prévia ocupa a
   área do vídeo e o chat fica só com a caixa; pausou, volta */
#app.assistindo .anim-mud, #app.assistindo .opiniao, #app.assistindo .rotulo, #app.assistindo .bloco, #app.assistindo .cab,
#app.assistindo .capas, #app.assistindo #msgs, #app.assistindo #trabalho { display: none !important; }
#app.assistindo .anim-previa { width: 100%; }
/* 24/10/2026 (ele: "quando estou em um vídeo na etapa animação, não tem mais o botão volta para a lista"): assistindo, a
   linha do título some, então o ‹ volta para a linha do logo */
#app.assistindo #voltar-topo { display: inline-block !important; }
#app.assistindo .anim-previa iframe, #app.assistindo .anim-previa .previa-mp4 { width: auto; height: calc(100dvh - 345px); aspect-ratio: 1080 / 1920; max-width: 100%; }
.anim-previa .previa-mp4{width:200px;height:356px;border:1px solid var(--linha);border-radius:10px;background:#05081a;object-fit:contain}
.previa-gerando{font-size:11px;color:var(--amarelo)}
/* 24/10/2026 (ele: "poderia diminuir o tamanho do preview para continuar aparecendo o botão publicar"): assistindo, o
   botão da etapa (Aprovar o vídeo, Publicar) fica à vista embaixo da prévia; a legenda do post sai da frente */
#app.assistindo .anim-previa > a, #app.assistindo #voltar-roteiro, #app.assistindo .legenda-post { display: none !important; }
/* 20/10/2026 ("aprovo o plano previa-de-trabalho"; ele: "quando dou play ou pause a tela muda"): aberta grande, a prévia fica
   grande tocando e pausada até o ✕; embaixo, o segundo grande, ±1 s, ±5 s e "pedir neste segundo" (escreve na caixa) */
.prev-ctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.prev-ctl button{min-width:34px;min-height:34px;padding:0 6px;border-radius:999px;border:0;background:var(--amarelo);color:#0a1748;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.prev-ctl #prev-t{min-width:62px;text-align:center;font-size:18px;color:var(--amarelo);font-variant-numeric:tabular-nums}
.prev-ctl #pedir-seg{background:transparent;color:var(--amarelo);border:1px solid var(--amarelo)}
.prev-ctl #fechar-previa{display:none;background:transparent;color:var(--texto);border:1px solid #8a93b8}
#app.assistindo .prev-ctl #fechar-previa{display:inline-block}
.anim-previa{flex:none;width:200px;display:flex;flex-direction:column;gap:4px;align-items:center}
.anim-previa iframe{width:200px;height:356px;border:1px solid var(--linha);border-radius:10px;background:#05081a}
.anim-previa a{font-size:11px;color:var(--azul)}
.anim-mud{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.anim-mud .rotulo{font-size:11px}
.anim-mud .t{font-size:12px;color:var(--apagado)}
.voltar-anim{align-self:flex-start;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #8a93b8;background:transparent;color:var(--texto);font:inherit;font-size:14px;cursor:pointer}
/* 16/10/2026 ("aprovo o plano v2-capa"): as duas opções de capa lado a lado, cada uma inteira e no recorte 3:4 da grade */
.capas{background:#101f57;border:1px solid #3a4f9c;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.capas-op{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.capa-op{display:flex;flex-direction:column;gap:4px;min-width:0;border:1px solid transparent;border-radius:8px;padding:4px}
.capa-op.escolhida{border-color:var(--amarelo)}
.capa-op img{width:100%;border-radius:4px;border:1px solid var(--linha);display:block}
.capa-op details summary{font-size:11px;color:var(--azul);cursor:pointer}
.anim-mud .capas{padding:6px}
.anim-mud .capas-op{gap:4px}.anim-mud .capa-op{padding:2px}
.capa-op b{font-size:11px;line-height:1.25;overflow-wrap:anywhere}
.capa-op .t{font-size:11px;color:var(--apagado);line-height:1.3}
.capa-op button{min-height:40px;font-size:12px!important;padding:0 4px;border-radius:10px;border:1px solid var(--amarelo);background:transparent;color:var(--amarelo);font:inherit;font-weight:700;cursor:pointer}
.capa-op .ok{font-size:11px;color:var(--amarelo);font-weight:700;min-height:40px;display:flex;align-items:center}
/* 16/10/2026 ("aprovo o plano botao-excluir"): discreto no cabeçalho; dois toques, como o Publicar */

// 25/10/2026 (medido no ar: ~3 MB por minuto por aba): a última resposta de cada consulta e a impressão dela (ETag); a
// tela pergunta "mudou?" (If-None-Match) e, com "304, nada mudou", usa a guardada, sem baixar de novo
const guardadas = new Map();
async function api(caminho, opcoes = {}, tempo = 15000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), tempo);
  const consulta = !opcoes.method || opcoes.method === 'GET', antes = consulta && guardadas.get(caminho);
  try {
    const r = await fetch(caminho, {...opcoes, signal: ctl.signal, cache: 'no-store',
      headers: {...(opcoes.headers || {}), ...(antes ? {'If-None-Match': antes.tag} : {})}});
    if (r.status === 304 && antes) return antes.j;
    if (r.status === 401) location.replace('/entrar');      // sessão do Face ID venceu (20/10/2026, entrada.py)
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || `erro ${r.status}`);
    const tag = r.headers.get('ETag');
    if (consulta && tag) guardadas.set(caminho, {tag, j});
    return j;
  } finally { clearTimeout(t); }
}

  else if (f.esperando === 'Aprovar o roteiro' && !proposta) h += `<div style="flex-grow:1"></div><button class="acao" id="aprovar">Aprovar o roteiro · grava a voz</button>`;
  // voz-parou-com-botao (22/10/2026): a voz que parou mostra o motivo e o botão de tentar de novo (antes, nada; vale

  // botoes-sempre (22/10/2026): na etapa Roteiro e voz sem voz gravada e sem nada rodando (o #334 ficou assim), gravar
  else if (f.etapa === 'Roteiro e voz' && !vz && f.passo === 'roteiro pronto' && !item.trabalhando && !item.pendentes)
    h += `<div style="flex-grow:1"></div><button type="button" class="acao" id="gravar-de-novo">Gravar a voz</button>`;
  if (f.esperando === 'Aprovar a voz') h += `<div style="flex-grow:1"></div><button class="acao" id="aprovar-voz">Aprovar a voz · vai para a animação</button>`;
  // 17/10/2026 ("aprovo o plano voz-com-problema"; ele: "não sinalizou isso na tela e não me dá opção de aprovar o
  // conserto"): o aviso fica embaixo, onde ele procura o botão, com consertar ou aprovar mesmo assim
  // achado voz-com-problema.1 (#211, 08:12): a tela se redesenha a cada 2 s e trazia os botões de volta enquanto o
  // pedido de conserto andava; dois toques viraram dois pedidos. Com o agente trabalhando ou pedido na fila, só o aviso
  const consertando = item.trabalhando || item.pendentes || envios.some(m => m.item === f.num && m._estado === 'enviando');
  if (f.esperando === 'Voz com problema' && consertando) h += `<div style="flex-grow:1"></div><div class="voz-problema"><b>Consertando a voz…</b></div>`;
  // 19/10/2026 (ele: "está ruim essa tela, não dá para ver o local de dar play"): cada problema com o seu "▶ ouvir",
  // que pula a voz para o começo daquele bloco e para no fim dele
  const probs = (vz && vz.problemas && vz.problemas.length) ? vz.problemas : (f.erro ? f.erro.split(' · ') : []);
  const jaTem = new Set();      // um botão por bloco (o bloco 10 tinha dois problemas e aparecia duas vezes)
  const ouvir = p => { const m = /bloco (\d+)/.exec(p), b = m && vz && (vz.blocos || []).find(x => x.n === +m[1]);
    if (!b || jaTem.has(b.n)) return ''; jaTem.add(b.n);
    return b ? `<button type="button" class="vp-ouvir" data-ouvir="${b.ini}" data-ate="${b.fim}">▶ ouvir bloco ${b.n}</button>` : ''; };
  if (f.esperando === 'Voz com problema' && !consertando) h += `<div style="flex-grow:1"></div><div class="voz-problema">
      <b>A conferência da voz achou:</b>
      <ul class="vp-lista">${probs.map(p => `<li><span>${esc(p)}</span>${ouvir(p)}</li>`).join('')}</ul>
      <span>Ouça cada um. Se estiver bom, pode aprovar mesmo assim.</span>
      <div class="vp-botoes"><button type="button" id="consertar-voz">Consertar</button>
      <button type="button" id="aprovar-voz-assim">Ouvi, está ok · aprovar a voz</button></div></div>`;
  // 22/10/2026 ("aprovo o plano botoes-sempre"; ele: "o botão que aprova deveria aparecer sempre e se tem alguma trava
  // deveria mostrar no botão uma msg quando eu tentar"): o botão principal da etapa está sempre lá; travado, ele fica
  // apagado e o toque diz no próprio botão o motivo e o que fazer (as travas são as de antes: nada aprova sem estar pronto)
  // travas-da-verificacao: a pauta que parou tenta de novo pelo botão (antes, só mandando uma mensagem)
  if (f.etapa === 'Pauta' && f.passo === 'parou')
    h += `<div style="flex-grow:1"></div><button type="button" class="acao" id="tentar-pauta">Tentar a pauta de novo</button>`;
  const PRINCIPAL = {'Pauta': ['aprovar', 'Aprovar o roteiro · grava a voz'], 'Roteiro e voz': ['aprovar-voz', 'Aprovar a voz · vai para a animação'],
                     'Animação': ['aprovar-video', 'Aprovar o vídeo · vai para Publicação'], 'Aguardando': ['publicar', 'Publicar no Instagram e no Facebook']};
  const pr = PRINCIPAL[f.etapa];
  // 24/10/2026 (ele: "o botão só pode estar disponível quando ele puder ser apertado"; no #369 o Aprovar a voz ficou aceso
  // enquanto o agente mudava a Tela, porque a espera "Aprovar a voz" continua gravada, e o toque deu erro duas vezes):
  // o botão aceso só fica se a ação vale neste passo pelo mapa (item.mapa.botoes), sem trabalho e sem mensagem pendente
  let apagado = false;
  if (pr && h.includes(`id="${pr[0]}"`) && !podeApertar(ACAO_DO_PRINCIPAL[pr[0]], f)) {
    h = h.replace(new RegExp(`<button[^>]*id="${pr[0]}"[^>]*>[\\s\\S]*?</button>`), ''); apagado = true;
  }
  if (pr && !proposta && !h.includes(`id="${pr[0]}"`) && (f.etapa !== 'Pauta' || item.blocos.length)) {
    const motivo = travaDaEtapa(f, item, vz) || (apagado ? 'Espere: o estúdio está trabalhando neste vídeo. O botão libera quando terminar.' : '');
    if (motivo) h += `<button type="button" class="acao travado" id="travado-${pr[0]}" data-trava="${esc(motivo)}">${esc(pr[1])}</button>`;
  }
  if (h === ultimoMeio) return;                    // nada mudou: não mexe na tela (nem na rolagem)
  const rolagem = $('#meio').scrollTop;
  // 16/10/2026 (ele: "em tela só fica piscando"): a prévia que já está na tela fica; só troca quando a animação muda de
  // versão. 25/10/2026 (ele, #382: "clicando no preview [...] pula a tela e não dá play"): antes a prévia SAÍA da página
  // e voltava a cada redesenho, e iframe que sai da página recarrega do zero (vídeo que sai pausa): tocava, o próximo
  // redesenho (o "gerando a prévia…", um passo novo) recarregava e parava. Agora ela nunca sai: o resto da tela é
  // trocado em volta dela (redesenhaEmVolta)
  const vivo = ['#previa-ifr', '#previa-mp4', '#final-v'].map(s => $(s)).find(Boolean);
  // a onda do "Publicando…", o Publicar e o voltar ao roteiro (o 1º toque) ficavam fora da página e voltavam a cada
  // redesenho; com o morphdom eles nunca saem (o vai-e-volta derrubava o clique)
  redesenhaEmVolta($('#meio'), h, vivo); ultimoMeio = h;
  { const cab = $('#meio .cab'); if (cab) $('#meio').style.setProperty('--cab-h', (cab.offsetHeight - 10) + 'px'); }   // a linha do roteiro presa logo abaixo do título
  $('#meio').scrollTop = rolagem;
  moverAcao();
}

// 25/10/2026: troca o conteúdo de `caixa` pelo de `h` sem tirar `vivo` (a prévia tocando) da página. Se o desenho novo
// tem o mesmo elemento (mesmo id e mesmo data-src), em cada nível, de dentro para fora, os irmãos dele são trocados pelos
// do desenho novo e o elemento fica onde está; senão, troca tudo, como antes.
function redesenhaEmVolta(caixa, h, vivo) {
  // 25/10/2026 (ele: "tem cliques que às vezes não respondem ou demoram [...] tem como não precisar redesenhar toda
  // vez?"): o painel inteiro era trocado (innerHTML) a cada mudança de texto (o "há 12 s", a porcentagem, um passo novo:
  // a cada 2 s durante o trabalho); os botões eram recriados e o toque que começava num e terminava no outro se perdia.
  // Agora o morphdom compara e muda só o texto ou o atributo diferente: o botão é o mesmo elemento, e a prévia, o
  // vídeo e o áudio que estão tocando ficam (mesmo data-src ou src)
  if (!window.morphdom) { caixa.innerHTML = h; return; }
  const novo = caixa.cloneNode(false); novo.innerHTML = h;
  morphdom(caixa, novo, {childrenOnly: true,
    getNodeKey: n => (n.id || (n.dataset && (n.dataset.no || n.dataset.capa || n.dataset.painel))) || undefined,
    onBeforeElUpdated: (de, para) => {
      if (de.isEqualNode(para)) return false;
      if (['IFRAME', 'VIDEO', 'AUDIO'].includes(de.tagName) && (de.dataset.src || de.getAttribute('src')) === (para.dataset.src || para.getAttribute('src'))) return false;
      if (de === document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(de.tagName)) return false;
      return true;
    }});
}

// mapa-de-passos (24/10/2026): os passos em que o estúdio está trabalhando vêm do servidor (passos.py, item.mapa);
// antes, duas listas aqui, cada uma diferente da do servidor
function trabalhandoNoPasso(p) { return ((item && item.mapa && item.mapa.trabalhando) || []).includes(p); }
const ACAO_DO_PRINCIPAL = {'aprovar': 'aprovar-roteiro', 'aprovar-voz': 'aprovar-voz', 'aprovar-video': 'aprovar-video', 'publicar': 'publicar'};
function podeApertar(acao, f) {
  const m = item && item.mapa;
  if (!m) return true;                               // servidor antigo, sem o mapa: como antes
  return m.botoes.includes(acao) && !item.trabalhando && !item.pendentes && !trabalhandoNoPasso(f.passo);
}
// botoes-sempre: o motivo do botão travado, em português de quem usa ("Espere: …", "Falta …", "toque em …")
function travaDaEtapa(f, item, vz) {
  const pct = f.progresso != null ? ` (${Math.round(f.progresso)}%)` : '';
  if (trabalhandoNoPasso(f.passo)) return `Espere: ${f.passo}${pct}. O botão libera quando terminar.`;
  if (item.trabalhando || item.pendentes) return 'Espere: o estúdio está respondendo o seu pedido no chat.';
  if (f.etapa === 'Pauta') return f.passo === 'parou' ? 'A pauta parou (o motivo está no chat): toque em Tentar a pauta de novo.'
    : `O roteiro ainda não está pronto para aprovar (${f.passo}).`;
  if (f.etapa === 'Roteiro e voz') {
    if (f.passo === 'voz parou') return 'A voz parou (o motivo está acima): toque em Gravar a voz.';
    if (f.esperando === 'Voz com problema') return 'A conferência achou problema na voz: ouça e toque em Consertar ou em Ouvi, está ok.';
    if (!vz) return 'A voz ainda não foi gravada: toque em Gravar a voz.';
    return `A voz ainda não pode ser aprovada (${f.passo}).`;
  }
  if (f.etapa === 'Animação') {
    const faltas = (item.animacao || {}).faltas || [];
    return faltas.length ? 'Para aprovar falta: ' + faltas.join('; ') + '.' : `Ainda não dá para aprovar (${f.passo}).`;
  }
  if (f.etapa === 'Aguardando') {
    const fin = (item.animacao || {}).final;
    if (['o vídeo final parou', 'vídeo final com problema'].includes(f.passo)) return `${f.passo === 'o vídeo final parou' ? 'O vídeo final parou' : 'O vídeo final saiu com problema'}: toque em Gerar o vídeo final de novo, ou peça o ajuste no chat.`;
    return !fin ? 'O vídeo final ainda não foi gerado.' : fin.erros.length ? 'O vídeo final tem problema: ' + fin.erros.join('; ') + '. Peça o ajuste no chat.'
      : `Ainda não dá para publicar (${f.passo}).`;
  }
  return '';
}

// o botão principal da etapa vai para o alto do chat (não cobre mais o roteiro); os cliques são pelo id, como antes
function moverAcao() {
  const slot = $('#acao-slot'), novos = [...$('#meio').querySelectorAll('.acao, .falta-aprovar')];   // o aviso "Para aprovar..." também (cobria a prévia)
  [...slot.children].forEach(b => { if (!b.id) b.remove(); else if (!novos.some(n => n.id === b.id)) b.remove(); });
  novos.forEach(n => { const v = n.id && slot.querySelector('#' + n.id);
    // botoes-sempre: o botão travado que fica atualiza o motivo (o estado do vídeo muda com a tela aberta)
    if (v && v.classList.contains('travado')) { v.dataset.trava = n.dataset.trava; if (!v.classList.contains('mostrando')) v.textContent = n.textContent; n.remove(); return; }
    if (v) { if (!v.disabled) n.remove(); else { v.replaceWith(n); } } else slot.appendChild(n); });
}

async function buscarNumeros(atualizar) {

  catch (e) { numeros[n] = Object.assign({}, numeros[n] || {}, {erro: e.message}); }

}

function bolha(m) {
  if (m.quem === 'ele') {
    // 24/10/2026 (ele: "esse carimbo de data está ocupando uma linha que não precisa, poderia ficar dentro do balão"):
    // a hora e o "recebida" vão no canto de baixo do balão, como no WhatsApp; o "não chegou" continua fora (é um botão)
    const st = m._estado === 'enviando' ? '<span class="carimbo enviando">enviando…</span>'
      : m._estado === 'falhou' ? '' : `<span class="carimbo">${hora(m.quando)} · ✓ recebida</span>`;
    const falhou = m._estado === 'falhou' ? `<span class="falhou" data-reenviar="${esc(m.id)}">não chegou · tocar para reenviar</span>` : '';
    return `<div class="dele-m"><div>${esc(m.texto)}${st}</div>${falhou}</div>`;
  }
  // 24/10/2026 (parte B): o relatório do animador (conferência, avisos, tempo, custo) vem fechado em "detalhes"
  const det = m.detalhes ? `<details class="detalhes" data-det="${esc(m.id)}"${detAbertos.has(m.id) ? ' open' : ''}><summary>detalhes</summary><p>${esc(m.detalhes)}</p></details>` : '';
  // a hora da resposta do agente também dentro do balão; a do aviso do sistema fica fora (o balão dele é cortado em 3 linhas)
  // e na própria mensagem de parada, enquanto a pauta estiver parada
  const baixar = /A pauta parou em/.test(m.texto) && item && item.ficha && item.ficha.passo === 'parou' && item.ficha.etapa === 'Pauta'
    ? ` <button type="button" class="pedir-ajuste" data-baixar="1">Baixar de novo</button>` : '';
  if (m.quem === 'sistema') return `<div class="resp-m sistema"><div class="md">${md(m.texto)}</div>${baixar}${det}<span>${hora(m.quando)}</span></div>`;
  return `<div class="resp-m"><div class="md">${md(m.texto)}<span class="carimbo">${hora(m.quando)}</span></div>${det}</div>`;
}

// 19/10/2026 (ele: "quando eu solicito algo ali no chat fica complicado ler a resposta"): a resposta vinha com os ** e
// os - crus e os links inteiros; agora negrito, lista, parágrafo e o link com o nome do site
function md(texto) {
  const linha = l => esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, n, u) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`);
  let h = '', lista = false;
  for (const l of String(texto).split('\n')) {
    const it = l.match(/^\s*[-•*]\s+(.*)/);
    if (it) { if (!lista) { h += '<ul>'; lista = true; } h += `<li>${linha(it[1])}</li>`; continue; }
    if (lista) { h += '</ul>'; lista = false; }
    const tit = l.match(/^\s*#{1,6}\s+(.*)/);          // tela-do-roteiro: o "## A pauta" do resumo vira título, não texto com ##
    if (tit) h += `<p><b>${linha(tit[1])}</b></p>`;
    else if (l.trim()) h += `<p>${linha(l)}</p>`;
  }
  return h + (lista ? '</ul>' : '');
}

// "pode fazer"): a tela Regras. Lista os cadernos (e as decisões do vídeo aberto); em cada caderno ele dita o que quer
// mudar, vê o que sai e o que entra, e só então grava; dá para desfazer a última mudança (regras_tela.py)
const rg = {aberto: null, dados: null, msg: '', ocupado: false, desfazerEm: 0};
async function regrasMostra(nome) {
  const tela = $('#regras-tela');
  rg.aberto = nome || null; tela.hidden = false;
  try {
    rg.dados = nome ? await api('/api/regras/' + nome) : await api('/api/regras' + (estado().item ? '?item=' + estado().item : ''));
  } catch (e) { rg.dados = null; rg.msg = 'Não abriu: ' + e.message; }

// os cadernos quebram a frase em linhas de 120 letras; a continuação volta para a linha de cima (senão vira parágrafo)
function desquebra(t) {
  const out = [];
  for (const l of String(t).split('\n')) {
    const ant = out.length ? out[out.length - 1] : '';
    if (l.trim() && ant.trim() && !/^\s*([-•*]\s|#|\||\d+[.)]\s)/.test(l) && !/^\s*(#|\|)/.test(ant)) out[out.length - 1] = ant + ' ' + l.trim();
    else out.push(l);
  }
  return out.join('\n');
}
function regrasDesenha() {
  const tela = $('#regras-tela'), d = rg.dados || {};
  const topo = (t, voltar) => `<div class="rg-topo">${voltar ? '<button type="button" class="rg-x" data-rg="lista" aria-label="Voltar">‹</button>' : ''}<b>${esc(t)}</b><button type="button" class="rg-x" data-rg="fechar" aria-label="Fechar">✕</button></div>`;
  const aviso = rg.msg ? `<p class="rg-aviso">${esc(rg.msg)}</p>` : '';
  if (!rg.aberto) {
    const dec = d.decisoes;
    tela.innerHTML = topo('Regras') + aviso
      + (dec ? `<div class="rg-sec">DECISÕES DESTE VÍDEO (#${esc(String(estado().item))})</div>`

const NOME_REGUA = {escondido: 'texto coberto', fora: 'texto fora da área do celular', sobreposto: 'textos um em cima do outro',
  encostado: 'texto colado em outro', estourado: 'texto saindo da caixa', invisivel: 'texto da mesma cor do fundo',
  'take-longo': 'fala longa sem variação na imagem', 'centro-vazio': 'centro da tela vazio', 'pedaço': 'imagem aparecendo só um pedaço',
  encavalado: 'troca de cena encavalada', pequeno: 'letra pequena', empilhado: 'dois rótulos no alto', 'falta-selo': 'falta o selo',
  vazio: 'tela vazia', erro: 'a régua não rodou', olhos: 'os Olhos ainda veem'};
function traduzRegua(g) {
  const m = String(g).match(/^([\d.]+)\s*s\s*·\s*([\w-]+)\s*·\s*(.*)$/);
  if (!m) return String(g);
  return `aos ${String(+m[1]).replace('.', ',')} s, ${NOME_REGUA[m[2]] || m[2]}: ${m[3]}`;
}

// a CHECAGEM.md tem tabela (afirmação | fonte | veredito): as linhas com "|" viram tabela, o resto segue o md()
function tabelaMd(texto) {
  let h = '', tab = [];
  const fecha = () => { if (!tab.length) return;
    const cel = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => md(c.trim()).replace(/^<p>|<\/p>$/g, ''));
    const [cab, ...resto] = tab.filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l));
    h += `<table class="checagem"><tr>${cel(cab).map(c => `<th>${c}</th>`).join('')}</tr>${resto.map(l => `<tr>${cel(l).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
    tab = []; };
  const solto = [];
  for (const l of String(texto).split('\n')) {
    if (/^\s*\|/.test(l)) { if (solto.length) { h += `<div class="md">${md(solto.join('\n'))}</div>`; solto.length = 0; } tab.push(l); }
    else { fecha(); solto.push(l); }
  }
  fecha(); if (solto.length) h += `<div class="md">${md(solto.join('\n'))}</div>`;
  return h;
}

// uma volta no ar por vez; resposta mais velha que a já aplicada não vale; a do fim, que ouviu tudo, vence sempre.

function regDitado(passo, extra) {

    enviarAoTerminar, chars: $('#caixa').value.length, ...(extra || {})})], {type: 'application/json'})); } catch (e) {}
}
async function ditar() {
  regDitado('toque em ditar');
  if (gravador) { gravador.stop(); return; }
  let fluxo;
  // 19/10/2026 (ele: "não estou conseguindo ativar o microfone"): anota o motivo e diz o que fazer
  try { fluxo = await navigator.mediaDevices.getUserMedia({audio: true}); } catch (e) {
    regDitado('microfone recusado', {erro: (e && e.name) + ': ' + (e && e.message), seguro: window.isSecureContext, endereco: location.host});

    $('#ditar span').textContent = 'microfone bloqueado'; $('#ditar').classList.add('gravando');

    alertaChat(e && e.name === 'NotAllowedError'

      : e && e.name === 'NotFoundError' ? 'Não achei nenhum microfone ligado neste aparelho.'
      : 'Não consegui usar o microfone (' + (e && e.name) + ').');
    return; }
  const c = $('#caixa'), base = c.value.trim() ? c.value.trim() + ' ' : '';
  const tipo = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
  gravador = new MediaRecorder(fluxo, {mimeType: tipo}); pedacos = [];
  const d = {seq: 0, aplicada: 0, noAr: false, fechado: false, texto: '', vazios: 0, mudo: false};  // este ditado (o anterior não escreve aqui)
  ditadoNoItem = estado().item;

  // o gravador segue mandando pedaços vazios) para o ditado e NÃO envia: o que ouviu fica na caixa, com o aviso
  const microfoneParou = (porque) => {
    if (d.mudo || d.fechado || !gravador) return;
    d.mudo = true; seguraEnvio = true; enviarAoTerminar = false; destinoDitado = null; $('#enviar').innerHTML = ICONE_ENVIAR;
    regDitado('microfone parou', {porque, bytes: pedacos.reduce((s, x) => s + x.size, 0)});
    if (gravador.state === 'recording') gravador.stop();
  };
  fluxo.getAudioTracks().forEach(tr => { tr.onmute = () => microfoneParou('faixa muda'); tr.onended = () => microfoneParou('faixa acabou'); });
  const transcreve = async (parcial) => {
    const r = await fetch('/api/ditar', {method: 'POST', headers: {'Content-Type': tipo, 'X-Parcial': parcial ? '1' : '0'},
                                          body: new Blob(pedacos, {type: tipo})});
    const j = await r.json().catch(() => ({erro: 'resposta inválida'}));

    // seguidos (1,5 s) depois do começo é o microfone desligado (no #382: 38.000 bytes aos 3 s, 38.946 aos 8 s)
    const total = pedacos.reduce((s, x) => s + x.size, 0);

    guardar(chaveRascunho(), c.value); crescer(); desenhaChips();
    $('#ditar span').textContent = ''; gravador = null; regDitado('transcrição voltou');
    ultimoMeio = ''; desenhaMeio();                      // o que mudou no vídeo enquanto ele ditava aparece agora
    if (d.mudo) alertaChat('O microfone parou de ouvir no meio do ditado (o aparelho desligou o microfone). O que ouvi até ali '
                           + 'ficou na caixa e NÃO foi enviado: toque no microfone, fale o resto e envie.');
    if (d.mudo) { enviarAoTerminar = false; destinoDitado = null; $('#enviar').innerHTML = ICONE_ENVIAR; }   // nem o toque em enviar logo depois
    if (enviarAoTerminar) { enviarAoTerminar = false; $('#enviar').innerHTML = ICONE_ENVIAR; const dest = destinoDitado; destinoDitado = null; enviar(dest); }
  };
  // 24/10/2026 (ele: "não mostra a palavra aparecendo conforme eu falo"): com fatia de 1 s, a 1ª parcial saía aos ~2 s
  // e voltava aos ~3,3 s; a frase dele durou 3 s e a parcial chegou depois do fim. Meio segundo: a 1ª sai em ~1 s.
  gravador.start(500); regDitado('gravando'); $('#ditar').classList.add('gravando'); $('#ditar span').textContent = 'parar';
}

  }
  else if (t.id === 'consertar-voz') {
    // vira uma mensagem dele no chat, como o "pedir ajuste" da segunda opinião
    // achado voz-com-problema.1: dois toques viraram dois pedidos (#211, 08:12:28 e 08:12:30); um pedido por 30 s
    if (Date.now() - (pedidoVoz[estado().item] || 0) < 30000) return;
    pedidoVoz[estado().item] = Date.now();
    t.disabled = true; t.textContent = 'pedindo…';
    const pb =(item && item.voz && item.voz.problemas || []).join(' · ') || item.ficha.erro || '';
    const msg = {id: novoId(), item: estado().item, quem: 'ele', quando: new Date().toISOString(),
      texto: `Conserta o problema que a conferência achou na voz: ${pb}. Muda só o necessário no roteiro.`};
    envios.push(msg); await mandar(msg);
  }
  else if (t.id === 'voltar-roteiro') {
    if (!t.dataset.armado) { t.dataset.armado = '1'; t.textContent = 'toque de novo para voltar ao roteiro';
      setTimeout(() => { if (document.body.contains(t)) { delete t.dataset.armado; t.textContent = 'voltar ao roteiro'; } }, 6000); return; }
    t.disabled = true; t.textContent = 'voltando…';
    try { await api(`/api/item/${estado().item}/voltar-roteiro`, {method: 'POST'}); } catch (e) { alertaChat('Não voltei ao roteiro: ' + e.message); }
    atualizar();
  }
  else if (t.id === 'mais-abaixo') { const c = $('#msgs'); c.scrollTop = c.scrollHeight; maisAbaixo(); }
  else if (t.id === 'enviar') enviar();
  else if (t.id === 'ditar') ditar();
  else if (t.id === 'anexar') $('#arquivo').click();
});
addEventListener('message', ev => {
  // 20/10/2026 ("aprovo o plano previa-de-trabalho"): o play abre grande; a pausa não fecha mais (era o "a tela muda")
  if (ev.data && ev.data.previa === 'tocando' && !$('#app').classList.contains('assistindo')) {
    $('#app').classList.add('assistindo');
    const p = $('.anim-previa'); if (p) p.scrollIntoView({block: 'start'});
  }
});
// a prévia em vídeo (previa-em-video) abre grande no play, como a ao vivo
document.addEventListener('play', ev => {
  if (ev.target.id === 'previa-mp4' && !$('#app').classList.contains('assistindo')) {
    $('#app').classList.add('assistindo');
    const p = $('.anim-previa'); if (p) p.scrollIntoView({block: 'start'});
  }
}, true);
// os botões −5/−1/+1/+5, o segundo grande e o "✎ pedir" comandam a prévia em vídeo ou a ao vivo
const previaJs = () => {
  const v = $('#previa-mp4');
  if (v) return {pula: d => { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); },
                 agora: () => v.currentTime, pausa: () => v.pause()};
  try { return $('#previa-ifr').contentWindow.__previa; } catch (e) { return null; }
};
const segundo = t => t.toFixed(1).replace('.', ',');
setInterval(() => { const el = $('#prev-t'), p = el && previaJs(); if (p) el.textContent = segundo(p.agora()) + ' s'; }, 150);
$('#msgs').addEventListener('scroll', maisAbaixo);
document.addEventListener('pointerdown', ev => { if (gravador) regDitado('dedo encostou', {em: (ev.target.closest('[id]') || {}).id || ev.target.tagName}); });
$('#arquivo').addEventListener('change', ev => { if (ev.target.files[0]) anexar(ev.target.files[0]); ev.target.value = ''; });
$('#caixa').addEventListener('input', () => { guardar(chaveRascunho(), $('#caixa').value); crescer(); desenhaChips(); });
$('#caixa').addEventListener('focus', () => $('#app').classList.add('escrevendo'));
$('#caixa').addEventListener('blur', () => setTimeout(() => $('#app').classList.remove('escrevendo'), 150));
$('#caixa').addEventListener('keydown', ev => { if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) enviar(); });
addEventListener('hashchange', () => { $('#app').classList.remove('assistindo'); verCapas = false; item = null; ultimoMeio = ''; ultimoChat = null; $('#msgs').innerHTML = ''; $('#caixa').value = lerGuardado(chaveRascunho()); tipoEscolhido = null; crescer(); desenhaChips(); $('#meio').scrollTop = 0; atualizar(); });
$('#caixa').value = lerGuardado(chaveRascunho()); crescer(); desenhaChips();
// a alça do chat (tela-do-roteiro.6): arrastar muda a altura do roteiro; a fração da tela fica guardada neste aparelho
(() => {
  const alca = $('#alca'), raiz = document.documentElement; let arrasto = null;
  const r = parseFloat(lerGuardado('alca-meio')); if (r > 0) raiz.style.setProperty('--meio-alt', Math.round(r * 1000) / 10 + 'dvh');
  alca.addEventListener('pointerdown', e => { arrasto = {y: e.clientY, h: $('#meio').getBoundingClientRect().height}; alca.setPointerCapture(e.pointerId); alca.classList.add('arrastando'); e.preventDefault(); });
  alca.addEventListener('pointermove', e => { if (!arrasto) return;
    const h = Math.max(120, Math.min(innerHeight - 260, arrasto.h + e.clientY - arrasto.y)); raiz.style.setProperty('--meio-alt', h + 'px'); });
  const solta = () => { if (!arrasto) return; arrasto = null; alca.classList.remove('arrastando');
    guardar('alca-meio', String($('#meio').getBoundingClientRect().height / innerHeight)); };
  alca.addEventListener('pointerup', solta); alca.addEventListener('pointercancel', solta);
})();
// 25/10/2026 (plano de melhorias): o servidor avisa quando algo muda (/api/eventos, SSE) e a tela busca na hora; a
// pergunta periódica fica como reserva (a cada 15 s; a cada 2 s se o aviso cair, até ele voltar)
let eventos = null, avisoVivo = false;
function abrirEventos() {
  if (eventos) eventos.close();
  if (!window.EventSource) return;
  const e = estado();
  eventos = new EventSource('/api/eventos' + (e.item ? '?item=' + e.item : ''));
  eventos.onopen = () => { avisoVivo = true; };
  eventos.onmessage = () => atualizar();
  eventos.onerror = () => { avisoVivo = false; };
}
addEventListener('hashchange', abrirEventos);
let ultimaReserva = 0;
atualizar(); abrirEventos();
setInterval(() => { if (!avisoVivo || Date.now() - ultimaReserva > 15000) { ultimaReserva = Date.now(); atualizar(); } }, 2000);
</script>
